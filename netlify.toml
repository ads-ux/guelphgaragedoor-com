[build]
publish = "."

[[redirects]]
from = "/services.html"
to = "/#services"
status = 302

[[redirects]]
from = "/bed-bug-exterminator-guelph"
to = "https://guelphexterminator.com/bed-bug-exterminator-guelph"
status = 301
force = true

[[redirects]]
from = "/carpenter-ants-guelph"
to = "https://guelphexterminator.com/carpenter-ants-guelph"
status = 301
force = true

[[redirects]]
from = "/exterminator-cost-guelph"
to = "https://guelphexterminator.com/exterminator-cost-guelph"
status = 301
force = true

[[redirects]]
from = "/mouse-exterminator-guelph"
to = "https://guelphexterminator.com/mouse-exterminator-guelph"
status = 301
force = true

[[redirects]]
from = "/wasp-nest-removal-guelph"
to = "https://guelphexterminator.com/wasp-nest-removal-guelph"
status = 301
force = true

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

# Redirect the raw Netlify subdomain to the primary domain
[[redirects]]
from = "https://guelphgaragedoor-com.netlify.app/*"
to = "https://guelphgaragedoor.com/:splat"
status = 301
force = true

# Consolidate duplicate domains onto the canonical guelphgaragedoor.com
[[redirects]]
from = "https://guelphgaragedoor.ca/*"
to = "https://guelphgaragedoor.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://guelphgaragedoorrepair.com/*"
to = "https://guelphgaragedoor.com/:splat"
status = 301
force = true
